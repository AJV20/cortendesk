# The ID server and relay, run alongside the console. Copied into
# /etc/supervisor.d/ by the entrypoint when CORTENDESK_EMBEDDED_SERVER is on;
# left out entirely when it is off, so nothing starts and nothing restarts.
#
# Both run as www-data out of /data/rustdesk, which holds the key pair and the
# peer database. -k _ means "use id_ed25519 in that directory and require it":
# hbbs enforces a key by default but hbbr does not, and without it anyone who
# can reach 21117 can use the relay as an open proxy.
#
# RUSTDESK_RELAY_ADVERTISED is the address hbbs hands to clients for the relay.
# It has to be reachable by them, so it is a public hostname, not localhost.

[program:hbbs]
command=hbbs -r %(ENV_RUSTDESK_RELAY_ADVERTISED)s -k _
directory=/data/rustdesk
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:hbbr]
command=hbbr -k _
directory=/data/rustdesk
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
