name: Strategy MySQL concurrency

on:
  pull_request:
    paths:
      - '.github/workflows/strategy-mysql-concurrency.yml'
      - 'app/Models/Device.php'
      - 'app/Models/Strategy.php'
      - 'app/Models/StrategyRollout.php'
      - 'database/migrations/**'
      - 'tests/Integration/StrategyMysqlConcurrencyTest.php'
      - 'phpunit.xml.dist'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cortendesk_test
          MYSQL_USER: cortendesk
          MYSQL_PASSWORD: cortendesk-test
          MYSQL_ROOT_PASSWORD: root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pcntl
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Exercise rollout races on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cortendesk_test
          DB_USERNAME: cortendesk
          DB_PASSWORD: cortendesk-test
        run: vendor/bin/pest tests/Integration/StrategyMysqlConcurrencyTest.php --colors=always
