# CortenDesk local TEST stack — a full self-hosted deployment mirroring what a
# real user runs: hbbs + hbbr (open-source RustDesk server) + MySQL + the
# CortenDesk Docker image built from this repo. Use this to test every change
# in the actual Docker artifact BEFORE it ever touches a live server.
#
#   bin/test-stack.sh up        build + start; console at http://localhost:8088
#   bin/test-stack.sh logs      tail
#   bin/test-stack.sh rebuild   rebuild the CortenDesk image after code changes
#   bin/test-stack.sh seed-prod load a prod DB snapshot into the test MySQL
#   bin/test-stack.sh down       stop (keep data)   |  down -v  wipe data
#
# Login: admin / changeme (first boot). Encryption is OFF in this stack for
# simplicity (no key wiring) — it's a functional test rig, not a secure server.
name: cortendesk-test

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cortendesk
      MYSQL_USER: cortendesk
      MYSQL_PASSWORD: cortendesk-test
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # hbbs/hbbr run on the internal compose network only — the console + browser
  # web client reach them through the CortenDesk container's ws bridge, so no
  # host ports are published (avoids clashing with anything on the dev machine).
  # To point a REAL external RustDesk desktop client at this stack, add
  # `ports: ["21116:21116", "21116:21116/udp"]` to hbbs and `["21117:21117"]`
  # to hbbr (make sure those ports are free first).
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r hbbr:21117
    volumes:
      - rustdesk:/root
    depends_on: [hbbr]
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - rustdesk:/root
    restart: unless-stopped

  # Keycloak — a real OIDC identity provider for testing the console's SSO.
  # SPLIT-HOST setup: the browser reaches Keycloak at http://localhost:8089,
  # but the cortendesk container reaches it back-channel over the compose
  # network at http://keycloak:8080. KC_HOSTNAME pins the public (browser)
  # base URL — and therefore the issuer — while
  # KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true lets the internal
  # http://keycloak:8080 discovery document keep working.
  #
  # The realm is provisioned from test/keycloak/realm-export.json on first boot
  # (--import-realm), so a `down -v` + `up` reprovisions it from scratch.
  #   realm:   cortendesk
  #   client:  cortendesk-console / test-client-secret-123 (confidential)
  #   users:   ssouser / ssopass123          (emailVerified: true)
  #            ssounverified / ssopass123    (emailVerified: false)
  #   admin console: http://localhost:8089/admin  (admin / admin)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Legacy names, harmless on 26.x, useful if the tag is rolled back:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8089
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8089:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped
    # NOTE: no volume for Keycloak's dev-mode H2 database — it is intentionally
    # ephemeral. The realm is re-imported from the JSON on every container
    # create, so realm-export.json is the single source of truth and there is no
    # stale-state drift. (A named volume here also fails: it mounts root-owned
    # while Keycloak runs as uid 1000, so H2 cannot write.) Anything you click
    # together in the admin console is lost on recreate — put it in the JSON.

  cortendesk:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cortendesk:test
    ports:
      - "8088:8080"
    environment:
      APP_NAME: CortenDesk
      APP_URL: http://localhost:8088
      APP_DEBUG: "true"           # surface errors in the test rig
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: cortendesk
      DB_USERNAME: cortendesk
      DB_PASSWORD: cortendesk-test
      # Point the console + web-client ws bridge at the in-compose RustDesk server
      CORTENDESK_ID_SERVER: hbbs:21116
      CORTENDESK_RELAY_SERVER: hbbr:21117
      RUSTDESK_WS_HOST: hbbs
      CORTENDESK_NATIVE_WEBCLIENT: "true"
      # Browser reaches the ws bridge on the published container port:
      CORTENDESK_WS_ID_URL: ws://localhost:8088/ws/id
      CORTENDESK_WS_RELAY_URL: ws://localhost:8088/ws/relay
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
      hbbs:
        condition: service_started
    restart: unless-stopped

volumes:
  db:
  rustdesk:
  data:
  keycloak:
